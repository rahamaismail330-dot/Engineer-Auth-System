<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Auth System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-blue: #38bdf8;
            --success-green: #22c55e;
            --error-red: #ef4444;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        #timer {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-blue);
        }

        button {
            background: var(--success-green);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #0f172a;
            white-space: pre-wrap;
            display: none; /* Hidden until results are ready */
            border-left: 4px solid var(--primary-blue);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Engineer Auth</h1>
        <p>You have <strong>10 seconds</strong> to complete registration.</p>
        
        <div id="timer">Ready?</div>
        
        <button id="startBtn" onclick="startProcess()">Start System</button>

        <div id="result"></div>
    </div>

    <script>
        function startProcess() {
            const resultDiv = document.getElementById("result");
            const timerDiv = document.getElementById("timer");
            const startBtn = document.getElementById("startBtn");

            // Reset UI
            resultDiv.style.display = "none";
            startBtn.disabled = true;
            startBtn.style.opacity = "0.5";

            let startTime = Date.now();
            
            // Logic for inputs
            let name = prompt("Enter your name:");
            let age = prompt("Enter your age:");

            let endTime = Date.now();
            let timeTaken = Math.floor((endTime - startTime) / 1000);

            // Calculate Result
            let output = `--- Status ---\nTime: ${timeTaken}s\n`;
            
            resultDiv.style.display = "block";

            if (timeTaken > 10) {
                resultDiv.style.borderLeftColor = "var(--error-red)";
                output += "❌ Access Denied: Too slow!";
            } else if (!name || !age) {
                resultDiv.style.borderLeftColor = "var(--error-red)";
                output += "⚠️ Error: Missing information.";
            } else {
                if (parseInt(age) >= 20) {
                    resultDiv.style.borderLeftColor = "var(--success-green)";
                    output += `Welcome, Engineer ${name}! 🛠️`;
                } else {
                    resultDiv.style.borderLeftColor = "var(--error-red)";
                    output += `Access Denied: ${name}, you are too young.`;
                }
            }

            resultDiv.innerText = output;
            timerDiv.innerText = "Process Complete";
            
            // Re-enable button
            startBtn.disabled = false;
            startBtn.style.opacity = "1";
        }
    </script>

</body>
</html>
